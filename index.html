<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>购物清单</title><style>
:root{--ink:#342d39;--muted:#948b98;--pink:#ff7fa8;--pink2:#ffe1ec;--yellow:#ffe49b;--mint:#ccefdc;--blue:#d9ecff;--purple:#e8ddff;--line:#f0e8ed}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8fb,#fffdf3 48%,#f5fffb);min-height:100vh}.app{max-width:900px;margin:auto;padding:30px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#ff8fb5,#ffd1e0);font-size:25px;box-shadow:0 8px 20px #ff9dbb35}.brand h1{margin:0;font-size:28px;letter-spacing:-1px}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:12px;padding:10px 12px;color:#756b78;box-shadow:0 5px 16px #8e6c7b10;cursor:pointer}
.add{display:grid;grid-template-columns:1fr 88px 50px;gap:8px;background:#fff;padding:10px;border-radius:18px;box-shadow:0 10px 30px #b990a518;margin-bottom:16px}input,textarea{font:inherit;border:0;outline:0;background:#faf7f9;border-radius:12px;padding:12px;color:var(--ink);width:100%}input:focus,textarea:focus{box-shadow:0 0 0 2px #ffd2e0}.addbtn{border:0;border-radius:12px;background:linear-gradient(135deg,#ff6d9c,#ff94b4);color:#fff;font-size:25px;box-shadow:0 7px 16px #ff78a53b;cursor:pointer}
.summary{display:flex;gap:8px;margin:12px 0 16px;overflow:auto}.pill{white-space:nowrap;border-radius:999px;padding:8px 13px;font-size:12px;background:#fff;box-shadow:0 3px 12px #7d65710e}.pill:nth-child(1){background:var(--pink2)}.pill:nth-child(2){background:#fff1c8}.pill:nth-child(3){background:#ddf5e8}.pill b{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{position:relative;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 28px #8d6e7d13;border:1px solid #fff;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:6px;background:var(--accent)}.card:nth-child(6n+1){--accent:#ff9fbd}.card:nth-child(6n+2){--accent:#ffd777}.card:nth-child(6n+3){--accent:#9ddfbd}.card:nth-child(6n+4){--accent:#a9d7ff}.card:nth-child(6n+5){--accent:#c9b5ff}.card:nth-child(6n){--accent:#ffb79d}.card.done{opacity:.64}.top{display:flex;align-items:flex-start;gap:11px}.check{appearance:none;width:23px;height:23px;min-width:23px;border:2px solid #d9d0d7;border-radius:8px;background:#fff;padding:0;cursor:pointer}.check:checked{background:var(--pink);border-color:var(--pink)}.check:checked:after{content:"✓";display:block;text-align:center;color:#fff;font-size:14px;line-height:19px}.main{min-width:0;flex:1}.name{font-weight:750;font-size:17px}.done .name{text-decoration:line-through}.meta{font-size:12px;color:var(--muted);margin-top:4px}.acts{display:flex;gap:3px;margin-top:13px}.acts button,.opacts button{border:0;border-radius:9px;background:#f8f4f6;color:#7d727d;padding:7px 9px;cursor:pointer}.acts button:first-child{background:#fff0f5;color:#d65a83}.compare{margin:14px -16px -16px;padding:13px 16px 16px;background:#fffafd;border-top:1px dashed #f0dce4}.ctitle{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:9px}.ctitle button{border:0;border-radius:9px;background:#ffe4ed;color:#c84e78;padding:7px 9px}.options{display:grid;gap:8px}.option{background:#fff;border:1px solid #f1e5ea;border-radius:13px;padding:11px}.option.best{background:#f3fff8;border-color:#a7ddc1}.ohead{display:flex;justify-content:space-between;font-weight:700}.badge{font-size:10px;color:#25805a;background:#dff6e9;border-radius:999px;padding:3px 7px}.price{font-size:18px;font-weight:800;margin:5px 0}.info{white-space:pre-wrap;font-size:12px;color:var(--muted)}.olink{font-size:12px;color:#4e86b8;text-decoration:none}.opacts{display:flex;gap:4px;margin-top:7px;font-size:12px}.empty{text-align:center;color:#b4aab2;padding:80px 10px}
.modalbg{display:none;position:fixed;inset:0;background:#4b37465e;backdrop-filter:blur(5px);z-index:20;align-items:center;justify-content:center;padding:16px}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fffafc;border-radius:24px;padding:20px;box-shadow:0 25px 70px #442b3d3d}.modal h3{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 3px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.ma button{border:0;border-radius:11px;padding:10px 16px}.cancel{background:#f5eff2}.save{background:linear-gradient(135deg,#ff709e,#ff9ab8);color:white}
@media(max-width:620px){.app{padding:22px 11px 70px}.brand h1{font-size:25px}.logo{width:42px;height:42px}.tool span{display:none}.add{grid-template-columns:1fr 70px 46px}.grid{grid-template-columns:1fr}.card{border-radius:18px}header{align-items:center}}

/* Larger typography for easier reading */
body{font-size:17px}.brand h1{font-size:32px}.tool{font-size:15px}.add input{font-size:17px}.pill{font-size:15px}.pill b{font-size:17px}.name{font-size:20px}.meta{font-size:15px;line-height:1.5}.acts button,.opacts button{font-size:15px}.ctitle{font-size:16px}.ctitle button{font-size:15px}.ohead{font-size:17px}.badge{font-size:12px}.price{font-size:21px}.info,.olink{font-size:15px;line-height:1.5}.field label{font-size:14px}.modal input,.modal textarea,.ma button{font-size:16px}.empty{font-size:16px}@media(max-width:620px){.brand h1{font-size:29px}.name{font-size:20px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">🛒</div><h1>购物清单</h1></div><div class="tools"><button class="tool" onclick="exportData()">↓ <span>备份</span></button><button class="tool" onclick="importFile.click()">↑ <span>恢复</span></button><button class="tool" onclick="clearBought()">✓ <span>清理</span></button><input id="importFile" hidden type="file" accept=".json" onchange="importData(event)"></div></header>
<div class="add"><input id="newName" placeholder="想买点什么？" onkeydown="if(event.key==='Enter')addItem()"><input id="newQty" value="1" placeholder="数量"><button class="addbtn" onclick="addItem()">＋</button></div>
<div class="summary"><span class="pill">全部 <b id="total">0</b></span><span class="pill">待购买 <b id="todo">0</b></span><span class="pill">已购买 <b id="done">0</b></span></div><div id="list" class="grid"></div></div>
<div id="modalBg" class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle">添加对比</h3><div class="field"><label>商品 / 方案</label><input id="opName" placeholder="名称"></div><div class="field"><label>价格</label><input id="opPrice" type="number" step=".01" placeholder="0.00"></div><div class="field"><label>渠道</label><input id="opStore" placeholder="京东、淘宝、线下…"></div><div class="field"><label>链接</label><input id="opLink" placeholder="https://…"></div><div class="field"><label>备注</label><textarea id="opNote" rows="3" placeholder="规格、优缺点等"></textarea></div><div class="ma"><button class="cancel" onclick="closeModal()">取消</button><button class="save" onclick="saveOption()">保存</button></div></div></div>
<script>
const KEY='shopping_compare_list_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}let editItemId=null,editOptionId=null;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function safeUrl(s=''){try{let u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return''}}function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addItem(){let n=newName.value.trim(),q=newQty.value.trim()||'1';if(!n)return;data.unshift({id:uid(),name:n,qty:q,done:false,open:false,options:[]});newName.value='';newQty.value='1';persist()}function toggle(id){let x=data.find(x=>x.id===id);x.done=!x.done;persist()}function fold(id){let x=data.find(x=>x.id===id);x.open=!x.open;persist()}function delItem(id){if(confirm('删除这个物品？')){data=data.filter(x=>x.id!==id);persist()}}function editItem(id){let x=data.find(x=>x.id===id),n=prompt('物品名称',x.name);if(n===null||!n.trim())return;let q=prompt('数量',x.qty);if(q===null)return;x.name=n.trim();x.qty=q.trim()||'1';persist()}
function openOption(i,o=null){editItemId=i;editOptionId=o;let x=o?data.find(x=>x.id===i).options.find(x=>x.id===o):{};modalTitle.textContent=o?'编辑对比':'添加对比';['Name','Price','Store','Link','Note'].forEach(k=>document.getElementById('op'+k).value=x[k.toLowerCase()]||'');modalBg.style.display='flex'}function closeModal(){modalBg.style.display='none'}function saveOption(){let x=data.find(x=>x.id===editItemId),n=opName.value.trim();if(!n)return;let v={name:n,price:opPrice.value,store:opStore.value.trim(),link:opLink.value.trim(),note:opNote.value.trim()};editOptionId?Object.assign(x.options.find(o=>o.id===editOptionId),v):x.options.push({id:uid(),best:false,...v});closeModal();persist()}function best(i,o){data.find(x=>x.id===i).options.forEach(x=>x.best=x.id===o);persist()}function delOption(i,o){let x=data.find(x=>x.id===i);x.options=x.options.filter(x=>x.id!==o);persist()}function clearBought(){if(data.some(x=>x.done)&&confirm('清理全部已购买物品？')){data=data.filter(x=>!x.done);persist()}}
function exportData(){let b=new Blob([JSON.stringify({version:1,data},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='购物清单备份.json';a.click();URL.revokeObjectURL(u)}function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let p=JSON.parse(r.result),d=Array.isArray(p)?p:p.data;if(!Array.isArray(d))throw 0;if(confirm('使用备份覆盖当前清单？')){data=d;persist()}}catch(x){alert('备份文件无法读取')}e.target.value=''};r.readAsText(f)}
function render(){total.textContent=data.length;todo.textContent=data.filter(x=>!x.done).length;done.textContent=data.filter(x=>x.done).length;if(!data.length){list.innerHTML='<div class="empty">还没有要买的东西</div>';return}list.innerHTML=data.map(i=>`<div class="card ${i.done?'done':''}"><div class="top"><input class="check" type="checkbox" ${i.done?'checked':''} onchange="toggle('${i.id}')"><div class="main"><div class="name">${E(i.name)}</div><div class="meta">数量 × ${E(i.qty)}${i.options.length?' · '+i.options.length+' 个对比':''}</div></div></div><div class="acts"><button onclick="fold('${i.id}')">${i.open?'收起':'对比'}</button><button onclick="editItem('${i.id}')">编辑</button><button onclick="delItem('${i.id}')">删除</button></div>${i.open?`<div class="compare"><div class="ctitle"><span>商品对比</span><button onclick="openOption('${i.id}')">＋ 添加</button></div><div class="options">${i.options.length?i.options.map(o=>{let u=safeUrl(o.link);return `<div class="option ${o.best?'best':''}"><div class="ohead"><span>${E(o.name)}</span>${o.best?'<span class="badge">已选</span>':''}</div>${o.price?`<div class="price">¥${Number(o.price).toFixed(2)}</div>`:''}<div class="info">${o.store?E(o.store)+'\\n':''}${E(o.note)}</div>${u?`<a class="olink" href="${E(u)}" target="_blank" rel="noopener">查看商品 →</a>`:''}<div class="opacts"><button onclick="best('${i.id}','${o.id}')">选择</button><button onclick="openOption('${i.id}','${o.id}')">编辑</button><button onclick="delOption('${i.id}','${o.id}')">删除</button></div></div>`}).join(''):'<div class="meta">暂无对比</div>'}</div></div>`:''}</div>`).join('')}render();
</script></body></html>
