<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>购物清单</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#181817;--sub:#8b8b87;--line:#ecece8;--soft:#f3f3f0;--green:#16845b;--red:#d95050}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:820px;margin:auto;padding:42px 18px 90px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.head h1{font-size:30px;letter-spacing:-1px;margin:0}.tools{display:flex;gap:7px}.iconbtn,.ghost{border:0;background:var(--soft);color:#555;border-radius:11px;height:38px;padding:0 12px;cursor:pointer;font-size:13px}
.add{display:grid;grid-template-columns:1fr 82px 46px;gap:8px;background:#fff;padding:9px;border-radius:16px;box-shadow:0 3px 20px #1c1c1c0a;border:1px solid #efefeb}
input,textarea{font:inherit;width:100%;border:0;background:var(--soft);border-radius:10px;padding:11px 12px;outline:none;color:var(--text)}input:focus,textarea:focus{box-shadow:0 0 0 2px #deded8}.addbtn{border:0;border-radius:10px;background:#181817;color:#fff;font-size:23px;cursor:pointer}
.stats{display:flex;gap:16px;padding:17px 4px 12px;color:var(--sub);font-size:12px}.stats b{color:#454542;font-weight:600}
.empty{text-align:center;color:#aaa;padding:72px 10px}.item{background:#fff;border:1px solid #eeeeea;border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 2px 14px #11111107}.item-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:15px}
.check{appearance:none;width:22px;height:22px;border:1.5px solid #d3d3ce;border-radius:50%;padding:0;background:#fff;cursor:pointer}.check:checked{background:#181817;border-color:#181817}.check:checked:after{content:"✓";display:block;color:white;text-align:center;line-height:20px;font-size:13px}.name{font-weight:650;font-size:16px}.meta{font-size:12px;color:var(--sub);margin-top:3px}.done .name{text-decoration:line-through;color:#aaa}
.actions{display:flex;gap:5px}.actions button,.option-actions button{border:0;background:transparent;color:#777;padding:7px;cursor:pointer;border-radius:8px}.actions button:hover,.option-actions button:hover{background:var(--soft);color:#222}.danger:hover{color:var(--red)!important}
.compare{border-top:1px solid var(--line);padding:14px 15px 15px;background:#fbfbfa}.compare-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:650}.compare-title button{border:0;background:#ecece8;border-radius:9px;padding:7px 10px;cursor:pointer}.compare-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.option.best{border-color:#8bcab0;background:#fbfffd}.option-head{display:flex;justify-content:space-between;gap:8px}.option-name{font-weight:650}.badge{font-size:10px;color:var(--green);background:#eaf7f1;border-radius:7px;padding:3px 6px}.price{font-size:19px;font-weight:700;margin-top:7px}.info{font-size:12px;color:var(--sub);white-space:pre-wrap;margin:6px 0}.link{font-size:12px;color:#4d6f9b;text-decoration:none}.option-actions{display:flex;gap:3px;margin-top:7px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:#0006;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 18px}.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:var(--sub);margin:0 0 5px 2px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.primary{border:0;background:#181817;color:#fff;border-radius:10px;padding:10px 16px}.secondary{border:0;background:var(--soft);border-radius:10px;padding:10px 16px}
@media(max-width:600px){.app{padding:25px 12px 70px}.head{margin-bottom:18px}.head h1{font-size:27px}.tools .backupText{display:none}.add{grid-template-columns:1fr 68px 44px}.item-main{grid-template-columns:auto 1fr}.actions{grid-column:2}.compare-grid{grid-template-columns:1fr}}
</style>
</head><body>
<div class="app">
<div class="head"><h1>购物清单</h1><div class="tools"><button class="iconbtn" onclick="exportData()" title="导出备份"><span class="backupText">备份</span> ↓</button><button class="iconbtn" onclick="document.getElementById('importFile').click()" title="导入备份"><span class="backupText">恢复</span> ↑</button><button class="iconbtn" onclick="clearBought()" title="清理已购">清理</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"></div></div>
<div class="add"><input id="newName" placeholder="添加要买的东西…" onkeydown="if(event.key==='Enter')addItem()"><input id="newQty" placeholder="数量" value="1"><button class="addbtn" onclick="addItem()">＋</button></div>
<div class="stats"><span>全部 <b id="totalStat">0</b></span><span>待买 <b id="todoStat">0</b></span><span>已买 <b id="doneStat">0</b></span></div><div id="list"></div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle">添加对比</h3>
<div class="field"><label>商品 / 方案</label><input id="opName" placeholder="名称"></div><div class="field"><label>价格</label><input id="opPrice" type="number" step="0.01" placeholder="0.00"></div><div class="field"><label>渠道</label><input id="opStore" placeholder="京东、淘宝、超市…"></div><div class="field"><label>链接</label><input id="opLink" placeholder="https://…"></div><div class="field"><label>备注</label><textarea id="opNote" rows="3" placeholder="规格、优缺点等"></textarea></div>
<div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="saveOption()">保存</button></div></div></div>
<script>
const KEY='shopping_compare_list_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}let editItemId=null,editOptionId=null;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(s=''){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}
function addItem(){const name=newName.value.trim(),qty=newQty.value.trim()||'1';if(!name)return;data.unshift({id:uid(),name,qty,done:false,open:false,options:[]});newName.value='';newQty.value='1';persist()}
function toggle(id){let x=data.find(i=>i.id===id);x.done=!x.done;persist()}function toggleCompare(id){let x=data.find(i=>i.id===id);x.open=!x.open;persist()}function delItem(id){if(confirm('删除这个物品？')){data=data.filter(i=>i.id!==id);persist()}}
function editItem(id){let x=data.find(i=>i.id===id),n=prompt('物品名称',x.name);if(n===null||!n.trim())return;let q=prompt('数量',x.qty);if(q===null)return;x.name=n.trim();x.qty=q.trim()||'1';persist()}
function openOption(itemId,optId=null){editItemId=itemId;editOptionId=optId;let o=optId?data.find(i=>i.id===itemId).options.find(o=>o.id===optId):{};modalTitle.textContent=optId?'编辑对比':'添加对比';['Name','Price','Store','Link','Note'].forEach(k=>document.getElementById('op'+k).value=o[k.toLowerCase()]||'');modalBg.style.display='flex'}function closeModal(){modalBg.style.display='none'}
function saveOption(){let item=data.find(i=>i.id===editItemId),name=opName.value.trim();if(!name)return;let val={name,price:opPrice.value,store:opStore.value.trim(),link:opLink.value.trim(),note:opNote.value.trim()};if(editOptionId)Object.assign(item.options.find(o=>o.id===editOptionId),val);else item.options.push({id:uid(),best:false,...val});closeModal();persist()}
function best(itemId,optId){data.find(i=>i.id===itemId).options.forEach(o=>o.best=o.id===optId);persist()}function delOption(itemId,optId){let item=data.find(i=>i.id===itemId);item.options=item.options.filter(o=>o.id!==optId);persist()}function clearBought(){if(data.some(i=>i.done)&&confirm('清理全部已购买物品？')){data=data.filter(i=>!i.done);persist()}}
function exportData(){let blob=new Blob([JSON.stringify({version:1,data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='购物清单备份.json';a.click();URL.revokeObjectURL(url)}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result),d=Array.isArray(p)?p:p.data;if(!Array.isArray(d))throw 0;if(confirm('使用备份覆盖当前清单？')){data=d;persist()}}catch(x){alert('备份文件无法读取')}e.target.value=''};r.readAsText(f)}
function render(){totalStat.textContent=data.length;todoStat.textContent=data.filter(i=>!i.done).length;doneStat.textContent=data.filter(i=>i.done).length;if(!data.length){list.innerHTML='<div class="empty">清单还是空的</div>';return}list.innerHTML=data.map(i=>`<div class="item ${i.done?'done':''}"><div class="item-main"><input class="check" type="checkbox" ${i.done?'checked':''} onchange="toggle('${i.id}')"><div><div class="name">${esc(i.name)}</div><div class="meta">× ${esc(i.qty)}${i.options.length?' · '+i.options.length+' 个对比':''}</div></div><div class="actions"><button onclick="toggleCompare('${i.id}')">${i.open?'收起':'对比'}</button><button onclick="editItem('${i.id}')">编辑</button><button class="danger" onclick="delItem('${i.id}')">删除</button></div></div>${i.open?`<div class="compare"><div class="compare-title"><span>商品对比</span><button onclick="openOption('${i.id}')">＋ 添加</button></div><div class="compare-grid">${i.options.length?i.options.map(o=>{let u=safeUrl(o.link);return `<div class="option ${o.best?'best':''}"><div class="option-head"><span class="option-name">${esc(o.name)}</span>${o.best?'<span class="badge">已选</span>':''}</div>${o.price?`<div class="price">¥${Number(o.price).toFixed(2)}</div>`:''}<div class="info">${o.store?esc(o.store)+'\\n':''}${esc(o.note)}</div>${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">查看商品 →</a>`:''}<div class="option-actions"><button onclick="best('${i.id}','${o.id}')">选择</button><button onclick="openOption('${i.id}','${o.id}')">编辑</button><button class="danger" onclick="delOption('${i.id}','${o.id}')">删除</button></div></div>`}).join(''):'<div class="meta">暂无对比</div>'}</div></div>`:''}</div>`).join('')}
render();
</script></body></html>
