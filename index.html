<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>购物清单</title>
<style>
:root{--ink:#342d39;--muted:#948b98;--pink:#ff7fa8;--pink2:#ffe1ec}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8fb,#fffdf3 48%,#f5fffb);min-height:100vh}.app{max-width:900px;margin:auto;padding:30px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#ff8fb5,#ffd1e0);font-size:25px;box-shadow:0 8px 20px #ff9dbb35}.brand h1{margin:0;font-size:32px}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:12px;padding:10px 12px;color:#756b78;font-size:15px;box-shadow:0 5px 16px #8e6c7b10}
.add{display:grid;grid-template-columns:1fr 88px 50px;gap:8px;background:#fff;padding:10px;border-radius:18px;box-shadow:0 10px 30px #b990a518;margin-bottom:16px}input,textarea{font:inherit;border:0;outline:0;background:#faf7f9;border-radius:12px;padding:12px;color:var(--ink);width:100%}.addbtn{border:0;border-radius:12px;background:linear-gradient(135deg,#ff6d9c,#ff94b4);color:#fff;font-size:25px}
.summary{display:flex;gap:8px;margin:12px 0 16px}.pill{border-radius:999px;padding:8px 13px;font-size:15px;background:#fff}.pill:nth-child(1){background:#ffe1ec}.pill:nth-child(2){background:#fff1c8}.pill:nth-child(3){background:#ddf5e8}.pill b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{position:relative;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 28px #8d6e7d13;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:6px;background:var(--accent)}.card:nth-child(6n+1){--accent:#ff9fbd}.card:nth-child(6n+2){--accent:#ffd777}.card:nth-child(6n+3){--accent:#9ddfbd}.card:nth-child(6n+4){--accent:#a9d7ff}.card:nth-child(6n+5){--accent:#c9b5ff}.card:nth-child(6n){--accent:#ffb79d}.card.done{opacity:.62}.top{display:flex;gap:11px}.check{appearance:none;width:24px;height:24px;min-width:24px;border:2px solid #d9d0d7;border-radius:8px;padding:0}.check:checked{background:#ff7fa8;border-color:#ff7fa8}.check:checked:after{content:"✓";display:block;text-align:center;color:white;line-height:20px}.main{flex:1}.name{font-weight:750;font-size:20px}.done .name{text-decoration:line-through}.meta{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.5}.acts,.opacts{display:flex;gap:4px;margin-top:13px}.acts button,.opacts button,.ctitle button,.photoBtn{border:0;border-radius:9px;background:#f8f4f6;color:#7d727d;padding:8px 10px;font-size:15px}.acts button:first-child,.ctitle button,.photoBtn{background:#ffe5ee;color:#c84e78}.compare{margin:14px -16px -16px;padding:13px 16px 16px;background:#fffafd;border-top:1px dashed #f0dce4}.ctitle{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;margin-bottom:9px}.options{display:grid;gap:8px}.option{background:#fff;border:1px solid #f1e5ea;border-radius:14px;padding:11px}.option.best{background:#f3fff8;border-color:#a7ddc1}.itemPhoto{width:100%;height:190px;object-fit:cover;border-radius:13px;margin-bottom:10px}.ohead{display:flex;justify-content:space-between;font-weight:700;font-size:17px}.badge{font-size:12px;color:#25805a;background:#dff6e9;border-radius:999px;padding:3px 7px}.price{font-size:21px;font-weight:800;margin:5px 0}.info,.olink{font-size:15px;line-height:1.5;color:var(--muted)}.olink{color:#4e86b8;text-decoration:none}.empty{text-align:center;color:#b4aab2;padding:80px 10px}
.modalbg{display:none;position:fixed;inset:0;background:#4b37465e;backdrop-filter:blur(5px);z-index:20;align-items:center;justify-content:center;padding:16px}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fffafc;border-radius:24px;padding:20px}.modal h3{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:14px;color:var(--muted);margin:0 0 5px 3px}.photoPick{display:flex;align-items:center;gap:9px}.preview{display:none;width:82px;height:82px;object-fit:cover;border-radius:13px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.ma button{border:0;border-radius:11px;padding:10px 16px;font-size:16px}.cancel{background:#f5eff2}.save{background:linear-gradient(135deg,#ff709e,#ff9ab8);color:#fff}
@media(max-width:620px){.app{padding:22px 11px 70px}.brand h1{font-size:29px}.logo{width:42px;height:42px}.tool span{display:none}.add{grid-template-columns:1fr 70px 46px}.grid{grid-template-columns:1fr}.itemPhoto{height:210px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🛒</div><h1>购物清单</h1></div><div class="tools"><button class="tool" onclick="exportData()">↓ <span>备份</span></button><button class="tool" onclick="clearBought()">✓ <span>清理</span></button></div></header>
<div class="add"><input id="newName" placeholder="想买点什么？"><input id="newQty" value="1" placeholder="数量"><button class="addbtn" onclick="addItem()">＋</button></div>
<div class="summary"><span class="pill">全部 <b id="total">0</b></span><span class="pill">待购买 <b id="todo">0</b></span><span class="pill">已购买 <b id="done">0</b></span></div>
<div id="list" class="grid"></div>
</div>
<div id="modalBg" class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3 id="modalTitle">添加对比</h3>
<div class="field"><label>商品 / 方案</label><input id="opName" placeholder="名称"></div>
<div class="field"><label>价格</label><input id="opPrice" type="number" step=".01" placeholder="0.00"></div>
<div class="field"><label>渠道</label><input id="opStore" placeholder="京东、淘宝、线下…"></div>
<div class="field"><label>链接</label><input id="opLink" placeholder="https://…"></div>
<div class="field"><label>图片</label><div class="photoPick"><button class="photoBtn" type="button" onclick="opImage.click()">＋ 添加图片</button><input id="opImage" type="file" accept="image/*" hidden onchange="pickImage(event)"><img id="opPreview" class="preview"><button id="removeImageBtn" class="cancel" type="button" style="display:none;border:0;padding:9px;border-radius:9px" onclick="removeImage()">移除</button></div></div>
<div class="field"><label>备注</label><textarea id="opNote" rows="3" placeholder="规格、优缺点等"></textarea></div>
<div class="ma"><button class="cancel" onclick="closeModal()">取消</button><button class="save" onclick="saveOption()">保存</button></div>
</div></div>
<script>
const SB='https://ctvpylxsqvyykgbudjqv.supabase.co';
const PK='sb_'+'publishable_'+'vPEs9Ep84Do59TtCF_'+'Ag7w_gJS5vhPm';
const HDR={apikey:PK,Authorization:'Bearer '+PK,'Content-Type':'application/json'};
let data=[],editItemId=null,editOptionId=null,tempFile=null,tempImage='';
const el=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...HDR,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
async function load(){try{let items=await api('shopping_items?select=*&order=sort_no.desc,created_at.desc'),ops=await api('shopping_options?select=*');data=items.map(i=>({...i,open:false,options:ops.filter(o=>o.item_id===i.id)}));render()}catch(e){alert('云端数据加载失败：'+e.message)}}
async function addItem(){let name=el('newName').value.trim(),qty=el('newQty').value.trim()||'1';if(!name)return;await api('shopping_items',{method:'POST',body:JSON.stringify({name,qty,sort_no:Date.now()})});el('newName').value='';el('newQty').value='1';load()}
async function toggle(id,done){await api('shopping_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify({done})});load()}
function fold(id){let x=data.find(v=>v.id===id);x.open=!x.open;render()}
async function delItem(id){if(confirm('删除这个物品？')){await api('shopping_items?id=eq.'+id,{method:'DELETE'});load()}}
async function editItem(id){let x=data.find(v=>v.id===id),n=prompt('物品名称',x.name);if(n===null||!n.trim())return;let q=prompt('数量',x.qty);if(q===null)return;await api('shopping_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify({name:n.trim(),qty:q.trim()||'1'})});load()}
function openOption(i,o=null){editItemId=i;editOptionId=o;let x=o?data.find(v=>v.id===i).options.find(v=>v.id===o):{};el('modalTitle').textContent=o?'编辑对比':'添加对比';['Name','Price','Store','Link','Note'].forEach(k=>el('op'+k).value=x[k.toLowerCase()]||'');tempImage=x.image_url||'';tempFile=null;showPreview();el('modalBg').style.display='flex'}
function closeModal(){el('modalBg').style.display='none'}
function showPreview(){el('opPreview').src=tempImage||'';el('opPreview').style.display=tempImage?'block':'none';el('removeImageBtn').style.display=tempImage?'inline-block':'none'}
function pickImage(e){let f=e.target.files?.[0];if(!f)return;if(f.size>10*1024*1024){alert('图片请控制在 10MB 以内');return}tempFile=f;tempImage=globalThis.URL.createObjectURL(f);showPreview()}
function removeImage(){tempFile=null;tempImage='';el('opImage').value='';showPreview()}
async function uploadImage(){if(!tempFile)return tempImage||null;let ext=(tempFile.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let r=await fetch(SB+'/storage/v1/object/shopping-images/'+path,{method:'POST',headers:{apikey:PK,Authorization:'Bearer '+PK,'Content-Type':tempFile.type||'image/jpeg'},body:tempFile});if(!r.ok)throw Error(await r.text());return SB+'/storage/v1/object/public/shopping-images/'+path}
async function saveOption(){let name=el('opName').value.trim();if(!name)return;try{let image_url=await uploadImage(),v={name,price:el('opPrice').value||null,store:el('opStore').value.trim()||null,link:el('opLink').value.trim()||null,note:el('opNote').value.trim()||null,image_url};if(editOptionId)await api('shopping_options?id=eq.'+editOptionId,{method:'PATCH',body:JSON.stringify(v)});else{v.item_id=editItemId;await api('shopping_options',{method:'POST',body:JSON.stringify(v)})}closeModal();load()}catch(e){alert('保存失败：'+e.message)}}
async function best(i,o){await api('shopping_options?item_id=eq.'+i,{method:'PATCH',body:JSON.stringify({is_selected:false})});await api('shopping_options?id=eq.'+o,{method:'PATCH',body:JSON.stringify({is_selected:true})});load()}
async function delOption(i,o){if(confirm('删除这个对比？')){await api('shopping_options?id=eq.'+o,{method:'DELETE'});load()}}
async function clearBought(){if(confirm('清理全部已购买物品？')){await api('shopping_items?done=eq.true',{method:'DELETE'});load()}}
function exportData(){let b=new Blob([JSON.stringify({version:2,data},null,2)],{type:'application/json'}),u=globalThis.URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='购物清单云端备份.json';a.click();globalThis.URL.revokeObjectURL(u)}
function render(){el('total').textContent=data.length;el('todo').textContent=data.filter(x=>!x.done).length;el('done').textContent=data.filter(x=>x.done).length;if(!data.length){el('list').innerHTML='<div class="empty">还没有要买的东西</div>';return}el('list').innerHTML=data.map(i=>`<div class="card ${i.done?'done':''}"><div class="top"><input class="check" type="checkbox" ${i.done?'checked':''} onchange="toggle('${i.id}',this.checked)"><div class="main"><div class="name">${E(i.name)}</div><div class="meta">数量 × ${E(i.qty)}${i.options.length?' · '+i.options.length+' 个对比':''}</div></div></div><div class="acts"><button onclick="fold('${i.id}')">${i.open?'收起':'对比'}</button><button onclick="editItem('${i.id}')">编辑</button><button onclick="delItem('${i.id}')">删除</button></div>${i.open?`<div class="compare"><div class="ctitle"><span>商品对比</span><button onclick="openOption('${i.id}')">＋ 添加</button></div><div class="options">${i.options.length?i.options.map(o=>`<div class="option ${o.is_selected?'best':''}">${o.image_url?`<img class="itemPhoto" src="${E(o.image_url)}">`:''}<div class="ohead"><span>${E(o.name)}</span>${o.is_selected?'<span class="badge">已选</span>':''}</div>${o.price?`<div class="price">¥${Number(o.price).toFixed(2)}</div>`:''}<div class="info">${E(o.store||'')}${o.store&&o.note?'<br>':''}${E(o.note||'')}</div>${o.link?`<a class="olink" href="${E(o.link)}" target="_blank" rel="noopener">查看商品 →</a>`:''}<div class="opacts"><button onclick="best('${i.id}','${o.id}')">选择</button><button onclick="openOption('${i.id}','${o.id}')">编辑</button><button onclick="delOption('${i.id}','${o.id}')">删除</button></div></div>`).join(''):'<div class="meta">暂无对比</div>'}</div></div>`:''}</div>`).join('')}
el('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});load();
</script>
</body></html>
